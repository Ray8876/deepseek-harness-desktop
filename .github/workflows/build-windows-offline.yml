name: Offline Windows Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: offline-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-x64 offline)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.22.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled plugins
        run: pnpm build:plugins

      - name: Build core TypeScript packages
        run: pnpm --filter dsh-tauri build && pnpm --filter dsh-tauri-ui build

      - name: Type check
        run: pnpm typecheck

      - name: Run Rust tests
        run: cargo test --all-features --locked
        working-directory: src-tauri

      - name: Prepare fixed offline assets
        run: pnpm offline:prepare

      - name: Verify fixed offline assets
        run: pnpm offline:verify

      - name: Build unsigned offline NSIS installer
        env:
          DSH_OFFLINE_BUILD: "1"
        run: pnpm tauri build --config src-tauri/tauri.offline.conf.json

      - name: Verify embedded offline WebView2 payload
        shell: pwsh
        run: |
          $cache = Get-ChildItem 'src-tauri/target/.tauri/x64' -Recurse -Filter 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe' | Select-Object -First 1
          if ($null -eq $cache) {
            throw 'Pinned WebView2 standalone installer was not staged in Tauri local tools cache.'
          }
          if ($cache.Length -lt 100MB) {
            throw "WebView2 payload is too small to be the standalone installer: $($cache.Length) bytes"
          }
          Write-Host "WebView2 standalone payload: $($cache.FullName) ($($cache.Length) bytes)"
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Recurse -Filter 'installer.nsi' | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'Generated NSIS script was not found.'
          }
          $script = Get-Content $nsis.FullName -Raw
          if ($script -notmatch 'offlineInstaller') {
            throw 'Generated NSIS script does not contain the offlineInstaller branch.'
          }
          if ($script -notmatch 'MicrosoftEdgeWebView2RuntimeInstallerX64\.exe') {
            throw 'Generated NSIS script does not embed the x64 standalone WebView2 installer.'
          }
          if ($script -notmatch 'ExecWait `"\$6`"') {
            throw 'Generated NSIS script does not quote the WebView2 executable path.'
          }

      - name: Finalize offline bundle
        run: pnpm offline:finalize

      - name: Upload offline bundle
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-harness-desktop-windows-x64-offline
          path: |
            src-tauri/target/release/bundle/offline-windows-x64/**
          if-no-files-found: error
          retention-days: 14
