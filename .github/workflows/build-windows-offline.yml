name: Offline Windows Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: offline-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-x64 offline)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.22.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled plugins
        run: pnpm build:plugins

      - name: Build core TypeScript packages
        run: pnpm --filter dsh-tauri build && pnpm --filter dsh-tauri-ui build

      - name: Type check
        run: pnpm typecheck

      - name: Run Rust tests
        run: cargo test --all-features --locked
        working-directory: src-tauri

      - name: Prepare fixed offline assets
        run: pnpm offline:prepare

      - name: Verify fixed offline assets
        run: pnpm offline:verify

      - name: Build unsigned offline NSIS installer
        env:
          DSH_OFFLINE_BUILD: '1'
        run: pnpm tauri build --config src-tauri/tauri.offline.conf.json

      - name: Verify separate offline WebView2 installer
        shell: pwsh
        run: |
          $sidecar = Get-Item 'src-tauri/target/offline-staging/MicrosoftEdgeWebView2RuntimeInstallerX64.exe' -ErrorAction SilentlyContinue
          if ($null -eq $sidecar) {
            throw 'Pinned WebView2 standalone installer was not staged beside the app bundle.'
          }
          if ($sidecar.Length -lt 100MB) {
            throw "WebView2 sidecar is too small to be the standalone installer: $($sidecar.Length) bytes"
          }
          Write-Host "WebView2 standalone sidecar: $($sidecar.FullName) ($($sidecar.Length) bytes)"
          $resourceCopy = [System.IO.Directory]::EnumerateFiles((Resolve-Path 'src-tauri/resources').Path, 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe', [System.IO.SearchOption]::AllDirectories) | Select-Object -First 1
          if ($null -ne $resourceCopy) {
            throw 'WebView2 standalone installer must not be included in Tauri resources.'
          }
          $config = Get-Content 'src-tauri/tauri.offline.conf.json' -Raw | ConvertFrom-Json
          if ($config.bundle.windows.webviewInstallMode.type -ne 'skip') {
            throw 'Offline Tauri config does not set webviewInstallMode.type to skip.'
          }
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.nsi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $nsis) {
            $script = Get-Content $nsis.FullName -Raw
            if ($script -notmatch 'INSTALLWEBVIEW2MODE "skip"') {
              throw 'Generated NSIS script does not skip WebView2 installation.'
            }
          } else {
            Write-Host 'NSIS intermediate script was not retained; offline config is verified as skip.'
          }

      - name: Finalize offline bundle
        run: pnpm offline:finalize

      - name: Verify side-by-side offline bundle
        shell: pwsh
        run: |
          $files = Get-ChildItem 'src-tauri/target/release/bundle/offline-windows-x64' -File
          if ($files.Count -ne 4) {
            throw "Expected four side-by-side release files, found $($files.Count)."
          }
          if ($files.Name -notcontains 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe') {
            throw 'Final bundle is missing the standalone WebView2 installer.'
          }
          if (($files.Name | Where-Object { $_ -like 'deepseek-harness-desktop-*-offline-setup.exe' }).Count -ne 1) {
            throw 'Final bundle must contain exactly one app installer.'
          }

      - name: Upload offline bundle
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-harness-desktop-windows-x64-offline
          path: |
            src-tauri/target/release/bundle/offline-windows-x64/**
          if-no-files-found: error
          retention-days: 30
