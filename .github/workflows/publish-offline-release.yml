name: Publish Offline Windows Release

on:
  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      target_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Offline Windows Build run ID
        required: true
        type: string
      tag:
        description: Release tag (vVERSION-offline-sidecar)
        required: true
        type: string
      target_sha:
        description: Exact artifact source commit
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-offline-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download completed offline build artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: deepseek-harness-desktop-windows-x64-offline
          path: release-assets
      - name: Verify checksums and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python scripts/publish-offline-release.py
