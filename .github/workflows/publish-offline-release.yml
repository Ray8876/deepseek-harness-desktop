name: Publish Offline Windows Release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing successful Offline Windows Build run ID
        required: true
        type: string
      tag:
        description: Release tag to create or update
        required: true
        default: v0.15.8-offline-sidecar
        type: string
      target_sha:
        description: Commit that the release tag should point to
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish existing offline artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download existing Actions artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: deepseek-harness-desktop-windows-x64-offline
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          installer="$(find release-assets -type f -iname 'deepseek-harness-desktop-*-offline-setup.exe' -print -quit)"
          webview="$(find release-assets -type f -iname 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe' -print -quit)"
          manifest="$(find release-assets -type f -name 'offline-manifest.json' -print -quit)"
          checksums="$(find release-assets -type f -name 'SHA256SUMS' -print -quit)"
          test -n "$installer"
          test -n "$webview"
          test -n "$manifest"
          test -n "$checksums"
          mkdir -p publish-assets
          cp "$installer" publish-assets/
          cp "$webview" publish-assets/
          cp "$manifest" publish-assets/
          cp "$checksums" publish-assets/

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## 离线安装修改版（独立 WebView2 Runtime）

          Windows x64 offline installer built from commit ${TARGET_SHA}.

          请先运行 MicrosoftEdgeWebView2RuntimeInstallerX64.exe 安装 WebView2 Runtime，再运行 deepseek-harness-desktop-0.15.8-windows-x64-offline-setup.exe 安装主程序。两个文件必须从同一个 Release 下载；主程序安装器不会联网下载或内置 WebView2 Runtime。

          构建来源：[GitHub Actions run](https://github.com/${GH_REPO}/actions/runs/${ARTIFACT_RUN_ID})
          EOF
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$TARGET_SHA" \
              --title "DeepSeek Harness Desktop 0.15.8 离线安装修改版（独立 WebView2 Runtime）" \
              --notes-file release-notes.md
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "DeepSeek Harness Desktop 0.15.8 离线安装修改版（独立 WebView2 Runtime）" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" publish-assets/* --repo "$GH_REPO" --clobber
